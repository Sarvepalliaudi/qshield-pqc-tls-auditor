[package]
name = "qshield-audit"
version = "1.0.0"
edition = "2021"
authors = ["Sarvepalli Audi Siva Bhanuvardhan"]
description = "Zero-bloat Post-Quantum TLS (NIST IR 8547 / FIPS 203) and OWASP HTTP security header auditing engine with deterministic Verilog silicon cipher policy mapping."
license = "Proprietary"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
webpki-roots = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
axum = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
